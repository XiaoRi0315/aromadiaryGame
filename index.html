<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>精神充電：調配今日元氣香氛 | 嗅覺日記 AromaDiary</title>
  <style>
    /* ===================================================
       1. 全域樣式與木質暖色變數
    =================================================== */
    :root {
      --bg-cream: #FAF6F0;
      --wood-main: #8D5B4C;
      --wood-dark: #453026;
      --wood-light: #D4A373;
      --soft-pink: #E8A598;
      --drop-yellow: #F6C343;
      --drop-purple: #A78BFA;
      --drop-green: #52B788;
      --noise-dark: #2A2033;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #EAD8C3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      touch-action: none; /* 禁止手機端雙擊放大、彈性回彈與整頁滾動 */
    }

    /* 手機直式主容器 */
    #gameApp {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 440px;
      margin: 0 auto;
      background: radial-gradient(circle at 50% 20%, #FFFFFF 0%, var(--bg-cream) 100%);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(69, 48, 38, 0.16);
    }

    /* 頂部資訊狀態條 */
    header {
      padding: 12px 18px 6px;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--wood-dark);
    }

    .brand-title {
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      color: var(--wood-main);
      font-weight: 800;
    }

    .timer-badge {
      background: rgba(232, 165, 152, 0.25);
      border: 1px solid rgba(232, 165, 152, 0.5);
      padding: 3px 12px;
      border-radius: 20px;
    }

    /* 主遊戲畫布 */
    canvas {
      flex: 1;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    /* ===================================================
       2. 彈窗層系統 (Modal) 與圖片容器規範
    =================================================== */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(42, 32, 51, 0.65);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 20;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .modal-card {
      background: #FFFFFF;
      border-radius: 24px;
      width: 100%;
      max-width: 360px;
      padding: 22px 18px;
      text-align: center;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.22);
      border: 1px solid rgba(212, 163, 115, 0.25);
      animation: popIn 0.26s cubic-bezier(0.175, 0.885, 0.32, 1.25);
    }

    @keyframes popIn {
      0% { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .modal-heading {
      font-size: 1.2rem;
      color: var(--wood-dark);
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: 0.04em;
    }

    /* 第一階段：情境選擇列表 */
    .scenario-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 6px;
    }

    .scenario-card {
      background: var(--bg-cream);
      border: 2px solid transparent;
      border-radius: 16px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
      touch-action: manipulation;
    }

    .scenario-card:active {
      transform: scale(0.98);
      background: #FFFFFF;
      border-color: var(--soft-pink);
    }

    /* 選擇方框圖片外層容器 */
    .avatar-frame {
      width: 60px;
      height: 60px;
      flex-shrink: 0;
      background: #FAF3EC;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      border: 1px solid rgba(141, 91, 76, 0.15);
    }

    /* 圖片自適應縮放，未放置圖檔時維持整齊 */
    .character-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .scenario-text-col {
      text-align: left;
    }

    .scenario-title {
      font-size: 0.96rem;
      font-weight: 800;
      color: var(--wood-dark);
      margin-bottom: 2px;
    }

    .scenario-desc {
      font-size: 0.74rem;
      color: #7A6960;
    }

    /* 第二階段：規則面板 */
    .rules-panel {
      background: var(--bg-cream);
      border-radius: 16px;
      padding: 14px;
      text-align: left;
      font-size: 0.82rem;
      color: #55443B;
      line-height: 1.6;
      margin: 12px 0 16px;
      border: 1px solid rgba(141, 91, 76, 0.1);
    }

    .rule-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .rule-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* 通用按鈕 */
    .btn-wood-primary {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, var(--wood-main) 0%, var(--wood-dark) 100%);
      color: #FFFFFF;
      border: none;
      border-radius: 25px;
      padding: 13px 0;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      box-shadow: 0 6px 14px rgba(69, 48, 38, 0.25);
      cursor: pointer;
      outline: none;
      touch-action: manipulation;
    }

    .btn-wood-primary:active {
      transform: scale(0.97);
      opacity: 0.92;
    }

    /* 第四階段：結算畫面唯一圖片容器規範 */
    .result-character-wrap {
      width: 96px;
      height: 96px;
      margin: 0 auto 10px;
      background: radial-gradient(circle, #FFFFFF 60%, var(--bg-cream) 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(232, 165, 152, 0.3);
      border: 2px solid #FFFFFF;
    }

    .result-battery-num {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--wood-main);
      margin: 2px 0;
    }

    .aroma-card {
      background: var(--bg-cream);
      border-left: 4px solid var(--wood-main);
      border-radius: 12px;
      padding: 12px 14px;
      text-align: left;
      font-size: 0.8rem;
      line-height: 1.55;
      color: #55443B;
      margin: 12px 0 18px;
    }

    .aroma-card b {
      color: var(--wood-dark);
      display: block;
      font-size: 0.86rem;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <div id="gameApp">
    <!-- 頂部資訊看板 -->
    <header>
      <span class="brand-title">AromaDiary 嗅覺日記</span>
      <div class="timer-badge">⏳ 倒數 <span id="timerTxt">30</span>s</div>
    </header>

    <!-- Canvas 遊戲畫布 -->
    <canvas id="gameCanvas"></canvas>

    <!-- 第一階段：情境選擇視窗 (預設彈出) -->
    <div id="modalSelect" class="modal-overlay">
      <div class="modal-card">
        <h2 class="modal-heading">請選擇情境：</h2>
        <div class="scenario-list">
          
          <!-- 方框一：焦慮 -->
          <div class="scenario-card" data-scenario="anxiety">
            <div class="avatar-frame">
              <img class="character-img" src="img/anxiety.png" alt="焦慮">
            </div>
            <div class="scenario-text-col">
              <div class="scenario-title">焦慮</div>
              <div class="scenario-desc">精神內耗緊繃，急需平靜安撫</div>
            </div>
          </div>

          <!-- 方框二：失眠 -->
          <div class="scenario-card" data-scenario="insomnia">
            <div class="avatar-frame">
              <img class="character-img" src="img/insomnia.png" alt="失眠">
            </div>
            <div class="scenario-text-col">
              <div class="scenario-title">失眠</div>
              <div class="scenario-desc">夜不安枕，需要引導深層放鬆</div>
            </div>
          </div>

          <!-- 方框三：需要專心 -->
          <div class="scenario-card" data-scenario="focus">
            <div class="avatar-frame">
              <img class="character-img" src="img/focus.png" alt="需要專心">
            </div>
            <div class="scenario-text-col">
              <div class="scenario-title">需要專心</div>
              <div class="scenario-desc">思緒大腦迷霧，急需重建專注力</div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- 第二階段：情境專屬規則說明視窗 -->
    <div id="modalRules" class="modal-overlay hidden">
      <div class="modal-card">
        <h2 id="ruleTitle" class="modal-heading">精神充電法則</h2>
        
        <div class="rules-panel">
          <div class="rule-item">
            <div id="targetColorDot" class="rule-dot"></div>
            <span>接取指定<b>【<span id="targetDropName"></span>】</b>：<b>+10 分</b></span>
          </div>
          <div class="rule-item">
            <div class="rule-dot" style="background: #2A2033; border: 1.5px solid #FF4D4F;"></div>
            <span>避開<b>【暗黑尖銳雜訊塊】</b>：<b>-5 分</b></span>
          </div>
          <div class="rule-item">
            <div class="rule-dot" style="background: #D1D5DB;"></div>
            <span>其餘非指定精油滴：<b>0 分</b> (不加不扣)</span>
          </div>
          <div style="margin-top: 8px; font-size: 0.76rem; color: #8D5B4C; font-weight: 600;">
            ⚡ 30 秒內將手上的電池電量充達 100 分即算過關！
          </div>
        </div>

        <button id="btnStartGame" class="btn-wood-primary">遊戲開始</button>
      </div>
    </div>

    <!-- 第四階段：結算畫面（唯一圖片容器結構，無任何導流按鈕） -->
    <div id="modalResult" class="modal-overlay hidden">
      <div class="modal-card">
        <!-- 結算畫面「唯一」治癒小人圖片容器 -->
        <div class="result-character-wrap">
          <img id="curedResultImg" class="character-img" src="" alt="治癒小人" />
        </div>
        
        <h2 id="resultStatus" class="modal-heading">充電完成</h2>
        <div id="resultBattery" class="result-battery-num">⚡ 100%</div>
        
        <!-- 動態科普香氛解說卡片 -->
        <div id="resultAromaCard" class="aroma-card"></div>

        <button id="btnPlayAgain" class="btn-wood-primary">再玩一次</button>
      </div>
    </div>
  </div>

  <script>
    /* ===================================================
       3. 遊戲核心邏輯與狀態管理 (Vanilla JavaScript)
    =================================================== */
    (function () {
      // DOM 節點
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const timerTxt = document.getElementById("timerTxt");

      // 彈窗節點
      const modalSelect = document.getElementById("modalSelect");
      const modalRules = document.getElementById("modalRules");
      const modalResult = document.getElementById("modalResult");

      // 規則元素
      const ruleTitle = document.getElementById("ruleTitle");
      const targetColorDot = document.getElementById("targetColorDot");
      const targetDropName = document.getElementById("targetDropName");
      const btnStartGame = document.getElementById("btnStartGame");

      // 結算元素 (唯一圖片容器)
      const curedResultImg = document.getElementById("curedResultImg");
      const resultStatus = document.getElementById("resultStatus");
      const resultBattery = document.getElementById("resultBattery");
      const resultAromaCard = document.getElementById("resultAromaCard");
      const btnPlayAgain = document.getElementById("btnPlayAgain");

      // 情境資料字典
      const SCENARIOS = {
        anxiety: {
          title: "焦慮・精神內耗",
          targetType: "yellow",
          targetColor: "#F6C343",
          dropLabel: "黃色精油滴",
          curedImgSrc: "img/anxiety_cured.png",
          oilName: "佛手柑 (Bergamot)",
          desc: "帶有陽光微甜的柑橘木質調，能迅速平衡中樞神經、撫平緊繃情緒，是告別精神內耗的解壓良方。"
        },
        insomnia: {
          title: "失眠・夜不安枕",
          targetType: "purple",
          targetColor: "#A78BFA",
          dropLabel: "紫色精油滴",
          curedImgSrc: "img/insomnia_cured.png",
          oilName: "薰衣草 (Lavender)",
          desc: "純淨溫和的草本香氣，能安定過度活躍的交感神經、引導腦波轉為慢速放鬆波，帶來一夜無夢好眠。"
        },
        focus: {
          title: "需要專心・思緒煥發",
          targetType: "green",
          targetColor: "#52B788",
          dropLabel: "綠色精油滴",
          curedImgSrc: "img/focus_cured.png",
          oilName: "迷迭香 (Rosemary)",
          desc: "清涼通透的草本松香，能劃破大腦疲憊迷霧、活化思緒與記憶力，快速重建專注力防線。"
        }
      };

      // 核心狀態變數
      let currentScenario = "anxiety"; // 'anxiety' | 'insomnia' | 'focus'
      let isPlaying = false;
      let score = 0;
      let timeLeft = 30;
      let timerInterval = null;
      let animFrameId = null;
      let lastSpawn = 0;
      let dpr = 1;

      // 玩家角色物件：底部手拿空電池的純白小人
      const player = {
        x: 0,
        y: 0,
        width: 82,
        height: 82,
        targetX: 0,
        shakeFrames: 0
      };

      // 掉落物與飄字陣列
      let drops = [];
      let floatingTexts = [];

      /* ===================================================
         畫布自適應 (Retina 高解析適配)
      =================================================== */
      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);

        player.y = rect.height - player.height - 20;
        if (!isPlaying) {
          player.x = (rect.width - player.width) / 2;
          player.targetX = player.x;
        }
      }
      window.addEventListener("resize", resizeCanvas);

      /* ===================================================
         使用者操作監聽 (Touchmove 與滑鼠拖曳)
      =================================================== */
      function setPlayerPosition(clientX) {
        if (!isPlaying) return;
        const rect = canvas.getBoundingClientRect();
        const touchX = clientX - rect.left;
        player.targetX = Math.max(0, Math.min(rect.width - player.width, touchX - player.width / 2));
      }

      window.addEventListener("touchmove", (e) => {
        if (e.touches.length > 0) setPlayerPosition(e.touches[0].clientX);
      }, { passive: false });

      window.addEventListener("mousemove", (e) => {
        if (isPlaying) setPlayerPosition(e.clientX);
      });

      /* ===================================================
         掉落物生成邏輯
      =================================================== */
      function spawnEntity() {
        const rect = canvas.getBoundingClientRect();
        const isNoise = Math.random() < 0.24;
        const radius = 14;
        const x = Math.random() * (rect.width - radius * 2) + radius;

        if (isNoise) {
          // 暗黑紫色尖銳雜訊塊
          drops.push({
            type: "noise",
            x: x,
            y: -radius * 2,
            radius: 16,
            speed: Math.random() * 1.6 + 3.2,
            points: [
              { a: 0, d: 15 }, { a: 0.8, d: 19 }, { a: 1.6, d: 13 },
              { a: 2.5, d: 21 }, { a: 3.5, d: 14 }, { a: 4.8, d: 20 }
            ]
          });
        } else {
          // 精油水滴：黃、紫、綠隨機
          const types = ["yellow", "purple", "green"];
          const picked = types[Math.floor(Math.random() * types.length)];
          let color = "#F6C343";
          if (picked === "purple") color = "#A78BFA";
          if (picked === "green") color = "#52B788";

          drops.push({
            type: picked,
            color: color,
            x: x,
            y: -radius * 2,
            radius: radius,
            speed: Math.random() * 1.5 + 3.0
          });
        }
      }

      function addFloatingText(text, x, y, color) {
        floatingTexts.push({ text, x, y, color, alpha: 1.0 });
      }

      /* ===================================================
         Canvas 渲染器：手持電池小人、動態流光與電量數字位移
      =================================================== */
      function renderPlayer(x, y, w, h) {
        ctx.save();

        // 碰觸扣分雜訊時的震動反饋
        let shake = 0;
        if (player.shakeFrames > 0) {
          shake = (Math.random() - 0.5) * 8;
          player.shakeFrames--;
        }
        ctx.translate(x + shake, y);

        // 1. 純白 Q 版身軀與頭部
        ctx.fillStyle = "#FFFFFF";
        ctx.strokeStyle = "#453026";
        ctx.lineWidth = 2.5;

        // 圓角身軀
        ctx.beginPath();
        ctx.roundRect(14, 34, 30, 36, [10, 10, 4, 4]);
        ctx.fill();
        ctx.stroke();

        // 圓潤大頭
        ctx.beginPath();
        ctx.arc(28, 22, 20, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // 簡約五官
        ctx.fillStyle = "#453026";
        ctx.beginPath();
        ctx.arc(23, 20, 2, 0, Math.PI * 2);
        ctx.arc(33, 20, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#453026";
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(28, 26, 4, 0.1 * Math.PI, 0.9 * Math.PI);
        ctx.stroke();

        // 腮紅
        ctx.fillStyle = "#FDE2E4";
        ctx.beginPath();
        ctx.arc(18, 24, 2.5, 0, Math.PI * 2);
        ctx.arc(38, 24, 2.5, 0, Math.PI * 2);
        ctx.fill();

        // 2. 右手拿著「空電池」
        const batX = 48;
        const batY = 24;
        const batW = 26;
        const batH = 46;

        // 電池外框
        ctx.fillStyle = "#FFFFFF";
        ctx.strokeStyle = "#453026";
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.roundRect(batX, batY, batW, batH, 6);
        ctx.fill();
        ctx.stroke();

        // 電池正極極耳
        ctx.fillStyle = "#8D5B4C";
        ctx.beginPath();
        ctx.roundRect(batX + (batW - 10) / 2, batY - 4, 10, 4, [2, 2, 0, 0]);
        ctx.fill();

        // 電池內部電量高度即時上升 (黃綠色漸層流光)
        const fillRatio = Math.min(100, Math.max(0, score)) / 100;
        const fillHeight = (batH - 6) * fillRatio;
        if (fillHeight > 0) {
          ctx.save();
          const batGrad = ctx.createLinearGradient(0, batY + batH - 3, 0, batY + 3);
          batGrad.addColorStop(0, "#F6C343");
          batGrad.addColorStop(1, "#52B788");
          ctx.fillStyle = batGrad;
          ctx.beginPath();
          ctx.roundRect(batX + 3, batY + batH - 3 - fillHeight, batW - 6, fillHeight, 3);
          ctx.fill();
          ctx.restore();
        }

        // 握持電池的小手臂
        ctx.strokeStyle = "#453026";
        ctx.lineWidth = 2.5;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(34, 46);
        ctx.lineTo(batX + 4, 48);
        ctx.stroke();

        // 3. 頭頂斜上方電量數字（跟隨小人左右平滑位移）
        ctx.fillStyle = "#8D5B4C";
        ctx.font = "bold 13px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`⚡ ${score}%`, 28, -6);

        ctx.restore();
      }

      /* ===================================================
         Canvas 渲染器：發光水滴 vs 暗黑尖角雜訊塊
      =================================================== */
      function renderDropItem(d) {
        ctx.save();
        if (d.type === "noise") {
          // 暗黑紫色尖銳鋸齒塊
          ctx.translate(d.x, d.y);
          ctx.shadowColor = "rgba(255, 77, 79, 0.85)";
          ctx.shadowBlur = 8;
          ctx.beginPath();
          d.points.forEach((pt, idx) => {
            const px = Math.cos(pt.a) * pt.d;
            const py = Math.sin(pt.a) * pt.d;
            if (idx === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          });
          ctx.closePath();
          ctx.fillStyle = "#2A2033";
          ctx.fill();
          ctx.lineWidth = 1.8;
          ctx.strokeStyle = "#FF4D4F";
          ctx.stroke();

          // 核心 ⚡ 標記
          ctx.shadowBlur = 0;
          ctx.font = "bold 12px sans-serif";
          ctx.fillStyle = "#FF7875";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("⚡", 0, 0);
        } else {
          // 晶瑩圓潤發光水滴
          ctx.translate(d.x, d.y);
          ctx.shadowColor = d.color;
          ctx.shadowBlur = 12;

          ctx.beginPath();
          ctx.moveTo(0, -d.radius * 1.3);
          ctx.bezierCurveTo(d.radius * 1.2, 0, d.radius, d.radius * 1.2, 0, d.radius * 1.2);
          ctx.bezierCurveTo(-d.radius, d.radius * 1.2, -d.radius * 1.2, 0, 0, -d.radius * 1.3);
          ctx.closePath();

          const grad = ctx.createRadialGradient(-d.radius * 0.2, -d.radius * 0.2, 2, 0, 0, d.radius);
          grad.addColorStop(0, "#FFFFFF");
          grad.addColorStop(0.35, d.color);
          grad.addColorStop(1, d.color);
          ctx.fillStyle = grad;
          ctx.fill();

          // 晶亮高光
          ctx.shadowBlur = 0;
          ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
          ctx.beginPath();
          ctx.arc(-d.radius * 0.35, -d.radius * 0.2, d.radius * 0.25, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      /* ===================================================
         遊戲更新與渲染循環 (Tick Loop)
      =================================================== */
      function gameLoop(timestamp) {
        if (!isPlaying) return;

        const rect = canvas.getBoundingClientRect();

        // 玩家位置平滑插值 (LERP)
        player.x += (player.targetX - player.x) * 0.28;

        // 生成掉落物 (約 500ms 一顆)
        if (timestamp - lastSpawn > 500) {
          spawnEntity();
          lastSpawn = timestamp;
        }

        ctx.clearRect(0, 0, rect.width, rect.height);

        // 掉落物移動與碰撞檢測
        for (let i = drops.length - 1; i >= 0; i--) {
          const d = drops[i];
          d.y += d.speed;

          renderDropItem(d);

          // 碰撞有效判定範圍
          const hitX = d.x >= player.x && d.x <= player.x + player.width;
          const hitY = d.y + d.radius >= player.y + 10 && d.y - d.radius <= player.y + player.height;

          if (hitX && hitY) {
            const conf = SCENARIOS[currentScenario];

            if (d.type === "noise") {
              // 接到雜訊 -5 分
              score = Math.max(0, score - 5);
              player.shakeFrames = 10;
              addFloatingText("-5", d.x, player.y, "#9333EA");
            } else if (d.type === conf.targetType) {
              // 接到指定顏色精油滴 +10 分
              score += 10;
              addFloatingText("+10", d.x, player.y, "#EAB308");
            } else {
              // 其餘非指定顏色精油滴 0 分
              addFloatingText("+0", d.x, player.y, "#9CA3AF");
            }

            drops.splice(i, 1);
            continue;
          }

          // 掉出畫布底端移除
          if (d.y - d.radius > rect.height) {
            drops.splice(i, 1);
          }
        }

        // 繪製手拿電池角色小人
        renderPlayer(player.x, player.y, player.width, player.height);

        // 繪製浮動跳字
        for (let j = floatingTexts.length - 1; j >= 0; j--) {
          const ft = floatingTexts[j];
          ft.y -= 1.3;
          ft.alpha -= 0.035;

          if (ft.alpha <= 0) {
            floatingTexts.splice(j, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = Math.max(0, ft.alpha);
          ctx.fillStyle = ft.color;
          ctx.font = "bold 16px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(ft.text, ft.x, ft.y);
          ctx.restore();
        }

        animFrameId = requestAnimationFrame(gameLoop);
      }

      /* ===================================================
         事件綁定 (click 與 touchend 雙支援 + stopPropagation)
      =================================================== */
      function bindFastTrigger(element, handler) {
        let lastTouchTime = 0;

        const trigger = (e) => {
          e.stopPropagation();
          e.preventDefault();
          const now = Date.now();
          if (now - lastTouchTime < 300) return; // 阻擋 300ms 內重複觸發
          lastTouchTime = now;
          handler(e);
        };

        element.addEventListener("click", trigger);
        element.addEventListener("touchend", trigger);
      }

      // 階段一：情境選擇
      document.querySelectorAll(".scenario-card").forEach((card) => {
        bindFastTrigger(card, () => {
          currentScenario = card.dataset.scenario;
          const conf = SCENARIOS[currentScenario];

          // 更新第二階段規則說明彈窗
          ruleTitle.textContent = `${conf.title} 說明`;
          targetColorDot.style.background = conf.targetColor;
          targetDropName.textContent = conf.dropLabel;

          // 平滑切換彈窗
          modalSelect.classList.add("hidden");
          modalRules.classList.remove("hidden");
        });
      });

      // 階段二：點擊「遊戲開始」按鈕
      bindFastTrigger(btnStartGame, () => {
        modalRules.classList.add("hidden");
        startSession();
      });

      function startSession() {
        score = 0;
        timeLeft = 30;
        drops = [];
        floatingTexts = [];
        isPlaying = true;

        timerTxt.textContent = timeLeft;
        resizeCanvas();

        // 30 秒倒數計時器
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
          timeLeft--;
          timerTxt.textContent = timeLeft;
          if (timeLeft <= 0) {
            endSession();
          }
        }, 1000);

        lastSpawn = performance.now();
        cancelAnimationFrame(animFrameId);
        animFrameId = requestAnimationFrame(gameLoop);
      }

      // 階段四：倒數結束結算
      function endSession() {
        isPlaying = false;
        clearInterval(timerInterval);
        cancelAnimationFrame(animFrameId);

        const conf = SCENARIOS[currentScenario];

        // 【關鍵規範】：對唯一的 <img> 標籤動態指派對應情境治癒圖片路徑
        curedResultImg.src = conf.curedImgSrc;

        // 滿電結果判定
        if (score >= 100) {
          resultStatus.textContent = "充電大成功！";
          resultBattery.textContent = `⚡ 滿電 ${score}%`;
          resultBattery.style.color = "var(--wood-main)";
        } else {
          resultStatus.textContent = "微電量待充";
          resultBattery.textContent = `⚡ 當前電量 ${score}%`;
          resultBattery.style.color = "var(--wood-dark)";
        }

        // 動態置換芳療科普解說卡片內容
        resultAromaCard.innerHTML = `
          <b>🌿 今日調配解方：${conf.oilName}</b>
          ${conf.desc}
        `;

        // 顯示結算視窗
        modalResult.classList.remove("hidden");
      }

      // 點擊「再玩一次」按鈕回到第一階段
      bindFastTrigger(btnPlayAgain, () => {
        modalResult.classList.add("hidden");
        modalSelect.classList.remove("hidden");
      });

      // 初次啟動自適應畫布
      resizeCanvas();
    })();
  </script>
</body>
